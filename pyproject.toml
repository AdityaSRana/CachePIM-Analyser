[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cachepim"
version = "1.1.0"
description = "A Statistical Simulator for Cache-Aware CPU–Processing-in-Memory Execution"
readme = "README.md"
authors = [{ name = "CachePIM Research Team" }]
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["cache", "processing-in-memory", "pim", "computer-architecture", "simulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
    "streamlit>=1.30.0",
    "plotly>=5.15.0",
    "pytest>=7.4.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
cachepim = "cachepim.run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cachepim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
